<meta charset="utf-8">

<script>
        document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
        {% if site.enable_copy_code_button -%}
                window.enable_copy_code_button = true;
        {%- endif %}
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="icon" type="image/x-icon" href="{{ '/assets/images/home/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/home/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/home/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/home/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/images/home/site.webmanifest' | relative_url }}">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css"></noscript>

<title>{{ page.title }}</title>

{% if site.head_scripts %}
        {% for script in site.head_scripts %}
                <script src="{{ script | relative_url }}"></script>
        {% endfor %}
{% endif %}
